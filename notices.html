<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notice Board</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
</head>
<body class="admin">

  <nav class="navbar">
    <a href="dashboard.html" class="brand">NGO Admin</a>
    <ul class="nav-links">
      <li><a href="volunteers.html">Volunteer Management</a></li>
      <li><a href="organizations.html">Organization Management</a></li>
      <li><a href="events.html">Event Management</a></li>
      <li><a href="notices.html" class="active">Notice Board</a></li>
    </ul>
    <button type="button" class="logout-btn" onclick="logout()">Logout</button>
  </nav>

  <main class="container">
    <h1>Notice Board</h1>
    <p class="subtitle">Post and remove notices.</p>

    <div id="message" class="message"></div>

    <section class="card">
      <h2>Post a Notice</h2>
      <form id="addForm">
        <div class="form-grid">
          <div class="full">
            <label for="title">Title</label>
            <input type="text" id="title" placeholder="Enter notice title">
          </div>
          <div class="full">
            <label for="text">Message</label>
            <textarea id="text" rows="3" placeholder="Write the notice here"></textarea>
          </div>
        </div>
        <button type="submit" class="btn">Post Notice</button>
      </form>
    </section>

    <section class="card">
      <h2>All Notices (<span id="count">0</span>)</h2>
      <div id="noticeList"></div>
    </section>
  </main>

  <script>
    var notices = loadData("notices");
    var listEl = document.getElementById("noticeList");
    var countEl = document.getElementById("count");
    var form = document.getElementById("addForm");

    function render() {
      listEl.innerHTML = "";
      countEl.textContent = notices.length;

      if (notices.length === 0) {
        listEl.appendChild(makeEl("p", "No notices yet.", "empty"));
        return;
      }

      notices.forEach(function (n) {
        var box = document.createElement("div");
        box.className = "notice";

        var content = document.createElement("div");
        content.appendChild(makeEl("h3", n.title));
        content.appendChild(makeEl("p", n.message));
        content.appendChild(makeEl("span", "Posted on " + formatDate(n.date), "notice-date"));

        var removeBtn = makeEl("button", "Remove", "btn-danger");
        removeBtn.type = "button";
        removeBtn.addEventListener("click", function () {
          removeNotice(n.id, n.title);
        });

        box.appendChild(content);
        box.appendChild(removeBtn);
        listEl.appendChild(box);
      });
    }

    function removeNotice(id, title) {
      if (!confirm("Remove the notice \"" + title + "\"?")) {
        return;
      }
      notices = notices.filter(function (n) {
        return n.id !== id;
      });
      saveData("notices", notices);
      render();
      showMessage("Notice removed.", "success");
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      var title = document.getElementById("title").value.trim();
      var text = document.getElementById("text").value.trim();

      if (title === "" || text === "") {
        showMessage("Please fill in the title and the message.", "error");
        return;
      }

      // newest notice goes on top
      notices.unshift({ id: nextId(notices), title: title, message: text, date: todayString() });
      saveData("notices", notices);
      render();
      form.reset();
      showMessage("Notice posted.", "success");
    });

    render();
  </script>

</body>
</html>
