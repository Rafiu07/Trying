<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteer Management</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
</head>
<body class="admin">

  <nav class="navbar">
    <a href="dashboard.html" class="brand">NGO Admin</a>
    <ul class="nav-links">
      <li><a href="volunteers.html" class="active">Volunteer Management</a></li>
      <li><a href="organizations.html">Organization Management</a></li>
      <li><a href="events.html">Event Management</a></li>
      <li><a href="notices.html">Notice Board</a></li>
    </ul>
    <button type="button" class="logout-btn" onclick="logout()">Logout</button>
  </nav>

  <main class="container">
    <h1>Volunteer Management</h1>
    <p class="subtitle">Add, view and remove volunteers.</p>

    <div id="message" class="message"></div>

    <section class="card">
      <h2>Add Volunteer</h2>
      <form id="addForm">
        <div class="form-grid">
          <div>
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter full name">
          </div>
          <div>
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" placeholder="e.g. 01712-345678">
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter email">
          </div>
        </div>
        <button type="submit" class="btn">Add Volunteer</button>
      </form>
    </section>

    <section class="card">
      <h2>All Volunteers (<span id="count">0</span>)</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    var volunteers = loadData("volunteers");
    var tableBody = document.getElementById("tableBody");
    var countEl = document.getElementById("count");
    var form = document.getElementById("addForm");

    function render() {
      tableBody.innerHTML = "";
      countEl.textContent = volunteers.length;

      if (volunteers.length === 0) {
        var emptyRow = document.createElement("tr");
        var emptyCell = makeEl("td", "No volunteers found.", "empty");
        emptyCell.colSpan = 5;
        emptyRow.appendChild(emptyCell);
        tableBody.appendChild(emptyRow);
        return;
      }

      volunteers.forEach(function (v, i) {
        var row = document.createElement("tr");
        row.appendChild(makeEl("td", i + 1));
        row.appendChild(makeEl("td", v.name));
        row.appendChild(makeEl("td", v.phone));
        row.appendChild(makeEl("td", v.email));

        var actionCell = document.createElement("td");
        var removeBtn = makeEl("button", "Remove", "btn-danger");
        removeBtn.type = "button";
        removeBtn.addEventListener("click", function () {
          removeVolunteer(v.id, v.name);
        });
        actionCell.appendChild(removeBtn);
        row.appendChild(actionCell);

        tableBody.appendChild(row);
      });
    }

    function removeVolunteer(id, name) {
      if (!confirm("Remove volunteer " + name + "?")) {
        return;
      }
      volunteers = volunteers.filter(function (v) {
        return v.id !== id;
      });
      saveData("volunteers", volunteers);
      render();
      showMessage(name + " has been removed.", "success");
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      var name = document.getElementById("name").value.trim();
      var phone = document.getElementById("phone").value.trim();
      var email = document.getElementById("email").value.trim();

      if (name === "" || phone === "" || email === "") {
        showMessage("Please fill in all fields.", "error");
        return;
      }

      if (!/^[0-9+\-\s]{7,16}$/.test(phone)) {
        showMessage("Please enter a valid phone number.", "error");
        return;
      }

      if (!isValidEmail(email)) {
        showMessage("Please enter a valid email address.", "error");
        return;
      }

      for (var i = 0; i < volunteers.length; i++) {
        if (volunteers[i].email.toLowerCase() === email.toLowerCase()) {
          showMessage("A volunteer with this email already exists.", "error");
          return;
        }
      }

      volunteers.push({ id: nextId(volunteers), name: name, phone: phone, email: email });
      saveData("volunteers", volunteers);
      render();
      form.reset();
      showMessage(name + " has been added.", "success");
    });

    render();
  </script>

</body>
</html>
