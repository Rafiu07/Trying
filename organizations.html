<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organization Management</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
</head>
<body class="admin">

  <nav class="navbar">
    <a href="dashboard.html" class="brand">NGO Admin</a>
    <ul class="nav-links">
      <li><a href="volunteers.html">Volunteer Management</a></li>
      <li><a href="organizations.html" class="active">Organization Management</a></li>
      <li><a href="events.html">Event Management</a></li>
      <li><a href="notices.html">Notice Board</a></li>
    </ul>
    <button type="button" class="logout-btn" onclick="logout()">Logout</button>
  </nav>

  <main class="container">
    <h1>Organization Management</h1>
    <p class="subtitle">Add, view and remove partner organizations.</p>

    <div id="message" class="message"></div>

    <section class="card">
      <h2>Add Organization</h2>
      <form id="addForm">
        <div class="form-grid">
          <div>
            <label for="name">Organization Name</label>
            <input type="text" id="name" placeholder="Enter organization name">
          </div>
          <div>
            <label for="regNo">Registration Number</label>
            <input type="text" id="regNo" placeholder="e.g. NGO-2020-0123">
          </div>
          <div>
            <label for="focus">Focus Area</label>
            <select id="focus">
              <option value="">Select focus area</option>
              <option>Education</option>
              <option>Healthcare</option>
              <option>Blood Donation</option>
              <option>Environment</option>
              <option>Youth Development</option>
              <option>Disaster Relief</option>
              <option>Other</option>
            </select>
          </div>
          <div>
            <label for="email">Contact Email</label>
            <input type="email" id="email" placeholder="Enter contact email">
          </div>
          <div>
            <label for="phone">Contact Phone</label>
            <input type="text" id="phone" placeholder="e.g. 01700-111222">
          </div>
          <div>
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Enter office address">
          </div>
        </div>
        <button type="submit" class="btn">Add Organization</button>
      </form>
    </section>

    <section class="card">
      <h2>All Organizations (<span id="count">0</span>)</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Reg. No.</th>
              <th>Focus Area</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Address</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    var orgs = loadData("organizations");
    var tableBody = document.getElementById("tableBody");
    var countEl = document.getElementById("count");
    var form = document.getElementById("addForm");

    function render() {
      tableBody.innerHTML = "";
      countEl.textContent = orgs.length;

      if (orgs.length === 0) {
        var emptyRow = document.createElement("tr");
        var emptyCell = makeEl("td", "No organizations found.", "empty");
        emptyCell.colSpan = 8;
        emptyRow.appendChild(emptyCell);
        tableBody.appendChild(emptyRow);
        return;
      }

      orgs.forEach(function (o, i) {
        var row = document.createElement("tr");
        row.appendChild(makeEl("td", i + 1));
        row.appendChild(makeEl("td", o.name));
        row.appendChild(makeEl("td", o.regNo));
        row.appendChild(makeEl("td", o.focus));
        row.appendChild(makeEl("td", o.email));
        row.appendChild(makeEl("td", o.phone));
        row.appendChild(makeEl("td", o.address));

        var actionCell = document.createElement("td");
        var removeBtn = makeEl("button", "Remove", "btn-danger");
        removeBtn.type = "button";
        removeBtn.addEventListener("click", function () {
          removeOrg(o.id, o.name);
        });
        actionCell.appendChild(removeBtn);
        row.appendChild(actionCell);

        tableBody.appendChild(row);
      });
    }

    function removeOrg(id, name) {
      if (!confirm("Remove " + name + "? Events posted by this organization will also be removed.")) {
        return;
      }
      orgs = orgs.filter(function (o) {
        return o.id !== id;
      });
      saveData("organizations", orgs);

      // Also remove the events this organization posted
      var events = loadData("events").filter(function (ev) {
        return ev.orgId !== id;
      });
      saveData("events", events);

      render();
      showMessage(name + " has been removed.", "success");
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      var name = document.getElementById("name").value.trim();
      var regNo = document.getElementById("regNo").value.trim();
      var focus = document.getElementById("focus").value;
      var email = document.getElementById("email").value.trim();
      var phone = document.getElementById("phone").value.trim();
      var address = document.getElementById("address").value.trim();

      if (name === "" || regNo === "" || focus === "" || email === "" || phone === "" || address === "") {
        showMessage("Please fill in all fields.", "error");
        return;
      }

      if (!isValidEmail(email)) {
        showMessage("Please enter a valid email address.", "error");
        return;
      }

      if (!/^[0-9+\-\s]{7,16}$/.test(phone)) {
        showMessage("Please enter a valid phone number.", "error");
        return;
      }

      for (var i = 0; i < orgs.length; i++) {
        if (orgs[i].regNo.toLowerCase() === regNo.toLowerCase()) {
          showMessage("An organization with this registration number already exists.", "error");
          return;
        }
      }

      orgs.push({
        id: nextId(orgs),
        name: name,
        regNo: regNo,
        focus: focus,
        email: email,
        phone: phone,
        address: address
      });
      saveData("organizations", orgs);
      render();
      form.reset();
      showMessage(name + " has been added.", "success");
    });

    render();
  </script>

</body>
</html>
