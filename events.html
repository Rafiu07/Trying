<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Management</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
</head>
<body class="admin">

  <nav class="navbar">
    <a href="dashboard.html" class="brand">NGO Admin</a>
    <ul class="nav-links">
      <li><a href="volunteers.html">Volunteer Management</a></li>
      <li><a href="organizations.html">Organization Management</a></li>
      <li><a href="events.html" class="active">Event Management</a></li>
      <li><a href="notices.html">Notice Board</a></li>
    </ul>
    <button type="button" class="logout-btn" onclick="logout()">Logout</button>
  </nav>

  <main class="container">
    <h1>Event Management</h1>
    <p class="subtitle">See which organization has posted which event.</p>

    <section class="card">
      <h2>All Events (<span id="count">0</span>)</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Event</th>
              <th>Posted By</th>
              <th>Category</th>
              <th>Location</th>
              <th>Date &amp; Time</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    var events = loadData("events");
    var orgs = loadData("organizations");
    var tableBody = document.getElementById("tableBody");

    function orgName(id) {
      for (var i = 0; i < orgs.length; i++) {
        if (orgs[i].id === id) {
          return orgs[i].name;
        }
      }
      return "Unknown";
    }

    document.getElementById("count").textContent = events.length;

    if (events.length === 0) {
      var emptyRow = document.createElement("tr");
      var emptyCell = makeEl("td", "No events found.", "empty");
      emptyCell.colSpan = 7;
      emptyRow.appendChild(emptyCell);
      tableBody.appendChild(emptyRow);
    }

    events.forEach(function (ev, i) {
      var row = document.createElement("tr");
      row.appendChild(makeEl("td", i + 1));
      row.appendChild(makeEl("td", ev.title));
      row.appendChild(makeEl("td", orgName(ev.orgId)));

      var categoryCell = document.createElement("td");
      categoryCell.appendChild(makeEl("span", ev.category, "badge"));
      row.appendChild(categoryCell);

      row.appendChild(makeEl("td", ev.location));
      row.appendChild(makeEl("td", formatDate(ev.date) + ", " + ev.time));
      row.appendChild(makeEl("td", ev.details));

      tableBody.appendChild(row);
    });
  </script>

</body>
</html>
