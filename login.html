<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-box">
    <h1>Admin Login</h1>
    <p class="subtitle">Sign in to continue</p>

    <div id="message" class="message"></div>

    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter your username" autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">

      <button type="submit">Login</button>
    </form>

    <p class="switch">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>

  <script>
    // Hard-coded credentials (change these whenever you want)
    var ADMIN_USERNAME = "admin";
    var ADMIN_PASSWORD = "admin123";

    var form = document.getElementById("loginForm");
    var messageBox = document.getElementById("message");

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = "message " + type;
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      var username = document.getElementById("username").value.trim();
      var password = document.getElementById("password").value;

      if (username === "" || password === "") {
        showMessage("Please fill in both fields.", "error");
        return;
      }

      if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
        sessionStorage.setItem("loggedIn", "true");
        showMessage("Login successful!", "success");

        // Go to the dashboard after a short moment
        setTimeout(function () {
          window.location.href = "dashboard.html";
        }, 800);
      } else {
        showMessage("Invalid username or password.", "error");
      }
    });
  </script>

</body>
</html>
